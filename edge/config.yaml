# ==============================================================================
# Configuración Física y Geométrica del Kit de Tanques (UTN FRSF / GITDA)
# ==============================================================================

# Geometría de los cilindros (secciones transversales distintas)
tank_a:
  area_cm2: 100.0          # Área transversal del cilindro A en cm^2
  height_max_cm: 40.0      # Altura útil máxima en cm
  volume_max_ml: 4000.0    # Capacidad máxima nominal en ml
  discharge_coeff: 0.045   # Coeficiente de descarga por gravedad hacia Tanque B
  initial_level_pct: 15.0  # Nivel inicial en %
  initial_temp_c: 23.5     # Temperatura inicial en °C

tank_b:
  area_cm2: 70.0           # Área transversal del cilindro B en cm^2 (diámetro menor)
  height_max_cm: 35.0      # Altura útil máxima en cm
  volume_max_ml: 2450.0    # Capacidad máxima nominal en ml
  discharge_coeff: 0.038   # Coeficiente de descarga por gravedad hacia el reservorio
  initial_level_pct: 10.0  # Nivel inicial en %
  initial_temp_c: 23.2     # Temperatura inicial en °C

# Parámetros de la bomba de impulsión
pump:
  nominal_flow_lpm: 2.2    # Caudal nominal de la bomba en L/min cuando está encendida
  initial_state: false     # Estado inicial (apagada)
  initial_pump: false      # Permite iniciar con la bomba encendida sin comandos por stdin

# Entorno térmico (puramente pasivo, sin actuadores térmicos)
thermal:
  ambient_temp_c: 22.5     # Temperatura ambiente de referencia en °C
  tau_seconds: 300.0       # Constante de tiempo de relajación térmica hacia ambiente

# Umbrales e interlocks de seguridad
interlocks:
  overflow_threshold_pct: 95.0 # Corte de seguridad automático por sobrellenado
  dry_run_prevention: false    # Futura protección contra funcionamiento en seco

# Ruido instrumental simulado (desviación estándar gaussiana)
noise:
  weight_noise_g: 1.2      # Ruido en gramos en celda de carga
  flow_noise_lpm: 0.04     # Ruido en caudalímetro (L/min)
  temp_noise_c: 0.08       # Ruido en sensor de temperatura (°C)

# Tasa de muestreo
timing:
  sample_interval_s: 1.0   # Intervalo nominal de emisión (1 Hz)
