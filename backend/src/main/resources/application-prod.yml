spring:
  datasource:
    url: jdbc:h2:file:./data/tanquesdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false

tanques:
  jwt:
    # En producción el secreto DEBE provenir de la variable de entorno JWT_SECRET (sin fallback)
    secret: ${JWT_SECRET}
  influx:
    # En producción la URL y el token de InfluxDB DEBEN provenir de variables de entorno (sin fallback)
    url: ${INFLUX_URL:}
    token: ${INFLUX_TOKEN:}
    org: ${INFLUX_ORG:utn-frsf}
    bucket: ${INFLUX_BUCKET:tanques}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # En producción las contraseñas iniciales DEBEN provenir de variables de entorno (sin default)
    default-docente-password: ${DOCENTE_PASSWORD}
    default-alumno-password: ${ALUMNO_PASSWORD}

