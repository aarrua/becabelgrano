# ==============================================================================
# Mosquitto MQTT Broker - Kit Tanques Didácticos (UTN FRSF / GITDA)
# ==============================================================================

# Puerto de escucha estándar
listener 1883 0.0.0.0

# Deshabilitar acceso anónimo: se exige usuario y contraseña obligatoriamente
allow_anonymous false

# Archivo de contraseñas hasheadas generado con mosquitto_passwd
password_file /mosquitto/config/passwords

# Persistencia de mensajes QoS 1 y sesiones
persistence true
persistence_location /mosquitto/data/

# Tópicos del sistema:
# - tanques/cmd : backend publica comandos (JSON del contrato de datos) con QoS 1
# - tanques/ack : bridge publica confirmaciones/rechazos (JSON ack) con QoS 1

# Registro de eventos
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
