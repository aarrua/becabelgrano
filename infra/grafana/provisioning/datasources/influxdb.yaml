apiVersion: 1

datasources:
  - name: InfluxDB_Tanques
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: utn-frsf
      defaultBucket: tanques
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
